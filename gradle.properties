android.useAndroidX=true
# Gradle daemon memory: the R8 release build runs after tests + lint + the
# debug APK in the same daemon and exhausted the default Metaspace
# (main run #183: "Gradle build daemon has been stopped ... out of JVM
# Metaspace" in the release step). 2 GB heap + 512 MB Metaspace fits the
# 16 GB GitHub runner and leaves room for R8.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
