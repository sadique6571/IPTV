<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPTV · TV Design Preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#0a111c;color:#f4f7fb;font:18px system-ui;--accent:#73fbd0;--card:#152338;--muted:#b3c2d5}body[data-look=B]{background:#141218;--accent:#ffca86;--card:#241e2a}body[data-look=C]{background:#101426;--accent:#bcb6ff;--card:#1f2746}button{font:inherit;color:inherit;border:1px solid #ffffff25;background:var(--card);border-radius:12px;padding:10px 16px;cursor:pointer}button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button[aria-pressed=true]{background:var(--accent);color:#0b1520;font-weight:750}header,main,footer{padding:20px clamp(20px,5vw,72px)}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}nav,.filters{display:flex;flex-wrap:wrap;gap:10px}strong{letter-spacing:.13em}strong span,small{color:var(--accent)}h1{font-size:clamp(2rem,5vw,4.5rem);margin:8px 0}h2{margin:0 0 12px}p,footer{color:var(--muted)}main{display:grid;gap:24px}.stage{background:radial-gradient(ellipse at 86% 10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 65%),var(--card);min-height:230px;padding:32px;border-radius:22px;display:flex;flex-direction:column;justify-content:flex-end}.channels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{text-align:left;min-height:100px}.tile span{display:block;color:var(--muted);font-size:.85em;margin-top:4px}body[data-look=B] main{grid-template-columns:minmax(220px,1fr) 2fr;align-items:start}body[data-look=B] .stage{grid-column:2;grid-row:1;min-height:380px}body[data-look=B] .channels{grid-template-columns:1fr}body[data-look=B] .tile{min-height:68px}body[data-look=C] .stage{min-height:140px}body[data-look=C] .channels{grid-template-columns:repeat(6,minmax(0,1fr))}body[data-look=C] .tile{min-height:115px}footer{font-size:.84em}@media(max-width:800px){body[data-look=C] .channels{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:600px){body[data-look=B] main{grid-template-columns:1fr}body[data-look=B] .stage{grid-column:auto;grid-row:auto;min-height:200px}.channels,body[data-look=C] .channels{grid-template-columns:repeat(2,minmax(0,1fr))}}
.watch{display:inline-flex;align-items:center;padding:10px 16px;border-radius:12px;background:var(--accent);color:#141218;text-decoration:none;font-weight:700}.watch:focus-visible{outline:3px solid var(--accent);outline-offset:4px}@media(min-width:601px){body[data-look=B] .stage{position:sticky;top:20px}.channels{max-height:55vh;overflow:auto;padding:5px}.filters{gap:8px}} </style><body data-look="B"><header><strong><span>◢</span> IPTV</strong></header><main><section class="stage" aria-live="polite"><small id="genre">PAKISTAN · NEWS</small><h1 id="name">Geo News</h1><p id="info">Official live news</p><div class="filters"><a id="watch" class="watch" href="https://live.geo.tv/" target="_blank" rel="noopener noreferrer">Open official player ↗</a><button id="favorite" aria-pressed="false">☆ Favorite</button></div></section><section><h2>Channels</h2><div class="filters" id="filters"></div><div class="channels" id="channels" style="margin-top:14px"></div></section></main><footer>Sources open in a separate tab · Match availability depends on the broadcaster and country · Arrow keys to move, Enter to select</footer><script>
const data=[["Geo News","News","Pakistan","https://live.geo.tv/","Official live news"],["ARY News","News","Pakistan","https://live.arynews.tv/pk/","Official live news"],["SAMAA TV","News","Pakistan","https://live.samaa.tv/","Official live news"],["NDTV India","News","India","https://ndtv.in/livetv-ndtvindia","Official live news"],["India Today","News","India","https://www.indiatoday.in/livetv","Official live news"],["DD News","News","India","https://prasarbharati.gov.in/en/live-tv/","Choose DD News under News"],["DD India","News","India","https://prasarbharati.gov.in/en/live-tv/","Choose DD India under News"],["Doordarshan Entertainment","Entertainment","India","https://prasarbharati.gov.in/en/live-tv/","Choose a feed under Entertainment or Regional Channels"],["Tamasha","Cricket","Pakistan","https://tamashaweb.com/","Select a live match. Free access varies by event."],["DD Sports","Cricket","India","https://prasarbharati.gov.in/en/live-tv/","Choose Sports. Match availability varies by rights and region."],["ICC.tv","Cricket","International","https://www.icc-cricket.com/Icc-tv","Live matches where available. Check event access for your region."]];const fav=new Set();let selected=0,filter='All';const byId=id=>document.getElementById(id);function detail(){const [name,genre,region,url,info]=data[selected];byId('name').textContent=name;byId('genre').textContent=(region+' · '+genre).toUpperCase();byId('info').textContent=info;byId('watch').href=url;byId('favorite').textContent=fav.has(selected)?'★ Favorited':'☆ Favorite';byId('favorite').setAttribute('aria-pressed',fav.has(selected));}function render(){byId('filters').replaceChildren(...['All','Pakistan','India','Cricket','News','Favorites'].map(label=>{const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed',label===filter);b.onclick=()=>{filter=label;render();[...byId('filters').children].find(x=>x.textContent===label).focus();};return b;}));byId('channels').replaceChildren(...data.flatMap(([name,genre,region],i)=>{if(!(filter==='All'||filter===genre||filter===region||(filter==='Favorites'&&fav.has(i))))return [];const b=document.createElement('button');b.className='tile';b.innerHTML='<b>'+name+'</b><span>'+region+' · '+genre+'</span>';b.onclick=()=>{selected=i;detail();};return [b];}));if(!byId('channels').children.length)byId('channels').textContent='No favorites yet.';}byId('favorite').onclick=()=>{if(fav.has(selected))fav.delete(selected);else fav.add(selected);detail();render();};document.addEventListener('keydown',e=>{const direction={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(!direction)return;e.preventDefault();const buttons=[...document.querySelectorAll('button, a.watch')];if(!buttons.includes(document.activeElement)){buttons[0].focus();return;}const center=b=>{const r=b.getBoundingClientRect();return [r.x+r.width/2,r.y+r.height/2];};const [x,y]=center(document.activeElement);const [dx,dy]=direction;const choices=buttons.map(b=>{const [a,c]=center(b),primary=(a-x)*dx+(c-y)*dy,secondary=Math.abs((a-x)*dy+(c-y)*dx);return {b,primary,score:primary+secondary*3};}).filter(item=>item.primary>5).sort((a,b)=>a.score-b.score);choices[0]?.b.focus();});render();detail();
</script></body></html>
