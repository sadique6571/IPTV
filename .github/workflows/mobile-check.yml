name: Verify released IPTV on Android phone
on:
  push:
    branches: [verify/mobile-episode-47]
permissions:
  contents: read
jobs:
  phone:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare temporary phone test
        run: |
          sudo chmod 666 /dev/kvm
          python3 -m venv /tmp/phone-test
          /tmp/phone-test/bin/pip -q install uiautomator2==3.2.10
          curl -fsSL https://github.com/sadique6571/IPTV/releases/download/v2.0.47/IPTV-debug.apk -o /tmp/released.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: |
            adb install /tmp/released.apk
            /tmp/phone-test/bin/python -u .github/mobile_check.py
