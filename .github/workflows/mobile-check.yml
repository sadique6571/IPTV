name: Verify released IPTV on Android phone
on:
  push:
    branches: [verify/audio-switch-phone-48]
permissions:
  contents: read
jobs:
  phone:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare temporary phone test
        run: |
          sudo chmod 666 /dev/kvm
          if ! command -v ffmpeg; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          ffmpeg -loglevel error -f lavfi -i color=s=320x180:r=8 -f lavfi -i sine=frequency=440 -f lavfi -i sine=frequency=220 -t 120 -map 0:v -map 1:a -map 2:a -c:v libx264 -preset ultrafast -c:a aac -metadata:s:a:0 language=eng -metadata:s:a:1 language=urd /tmp/audio-test.mp4
          python3 -m venv /tmp/phone-test
          /tmp/phone-test/bin/pip -q install uiautomator2==3.2.10
          bash gradlew assembleDebug > /tmp/build-output 2>&1 || { tail -35 /tmp/build-output; exit 1; }
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            /tmp/phone-test/bin/python -u .github/mobile_check.py
