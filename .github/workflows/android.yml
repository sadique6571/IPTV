name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build-apk.sh'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  # contents:write is needed for the Publish GitHub Release step below
  # (gh release create / upload). Everything else only reads.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          : "${sdk_root:?The runner did not provide an Android SDK path}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          if [[ ! -f "$sdk_root/platforms/android-35/android.jar" || ! -x "$sdk_root/build-tools/35.0.0/aapt2" ]]; then
            sdkmanager --sdk_root="$sdk_root" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Build debug APK with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # In-app auto-update (UpdateChecker.kt): every main-branch build
      # publishes the APK as a GitHub Release so the app can check for it
      # via the public releases API — no token needed (repo is public).
      # Tag convention: v<versionName>.<versionCode> (e.g. v2.0.12).
      # The app parses the versionCode from the LAST dot segment, so bump
      # versionCode in app/build.gradle.kts for every build users should get.
      # If the tag already exists (same versionCode pushed twice), the asset
      # is overwritten instead of failing the build.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_name=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          version_code=$(grep -m1 'versionCode' app/build.gradle.kts | grep -oE '[0-9]+')
          tag="v${version_name}.${version_code}"
          cp app/build/outputs/apk/debug/app-debug.apk IPTV-debug.apk
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" IPTV-debug.apk --clobber
          else
            gh release create "$tag" IPTV-debug.apk \
              --title "IPTV $version_name (build $version_code)" \
              --notes "Auto-built from main. Installs over the previous build (same signing key)."
          fi
          echo "Published release $tag"
