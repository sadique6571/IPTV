name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'scripts/compact_apk.py'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build-apk.sh'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  # contents:write is needed for the Publish GitHub Release step below
  # (gh release create / upload). Everything else only reads.
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          : "${sdk_root:?The runner did not provide an Android SDK path}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          if [[ ! -f "$sdk_root/platforms/android-35/android.jar" || ! -x "$sdk_root/build-tools/35.0.0/aapt2" ]]; then
            sdkmanager --sdk_root="$sdk_root" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Run unit tests and Android lint
        run: |
          if ! bash gradlew :app:testDebugUnitTest :app:lintDebug; then
            if [ -f app/build/reports/lint-results-debug.xml ]; then
              python3 - <<'PYLINT'
          import xml.etree.ElementTree as xml
          for issue in xml.parse("app/build/reports/lint-results-debug.xml").findall("issue"):
              if issue.get("severity") in ("Error", "Fatal"):
                  node = issue.find("location")
                  print(issue.get("id"), node.get("file"), node.get("line"), issue.get("message")[:180])
          PYLINT
            fi
            exit 1
          fi
      - name: Build debug APK with Gradle
        run: |
          chmod +x gradlew
          ./gradlew :app:compactDebugApk --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-debug
          path: app/build/outputs/compact/IPTV-debug.apk
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: IPTV-debug
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_name=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          version_code=$(grep -m1 'versionCode' app/build.gradle.kts | grep -oE '[0-9]+')
          tag="v${version_name}.${version_code}"
          cp release/IPTV-debug.apk IPTV-debug.apk
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" IPTV-debug.apk --clobber
          else
            gh release create "$tag" IPTV-debug.apk \
              --title "IPTV $version_name (build $version_code)" \
              --notes "Auto-built from main. Installs over the previous build (same signing key)."
          fi
          echo "Published release $tag"
