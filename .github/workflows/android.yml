name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'scripts/compact_apk.py'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build-apk.sh'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  # contents:write is needed for the Publish GitHub Release step below
  # (gh release create / upload). Everything else only reads.
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Cache Gradle dependencies + wrapper: without this every run
      # re-downloads hundreds of artifacts from Maven Central — that is
      # what filled the log with ~140k lines and tripped its 429 rate
      # limit on main run #165. The key changes when any Gradle file
      # changes, so a dependency bump still resolves fresh.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Prepare Android SDK
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          : "${sdk_root:?The runner did not provide an Android SDK path}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          if [[ ! -f "$sdk_root/platforms/android-35/android.jar" || ! -x "$sdk_root/build-tools/35.0.0/aapt2" ]]; then
            sdkmanager --sdk_root="$sdk_root" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Run unit tests and Android lint
        run: |
          # --quiet: Gradle's default output logs every downloaded file
          # and every lint warning (tens of thousands of lines). Errors
          # still print, and the lint-error fallback below still runs.
          if ! bash gradlew --quiet :app:testDebugUnitTest :app:lintDebug; then
            if [ -f app/build/reports/lint-results-debug.xml ]; then
              python3 - <<'PYLINT'
          import xml.etree.ElementTree as xml
          for issue in xml.parse("app/build/reports/lint-results-debug.xml").findall("issue"):
              if issue.get("severity") in ("Error", "Fatal"):
                  node = issue.find("location")
                  print(issue.get("id"), node.get("file"), node.get("line"), issue.get("message")[:180])
          PYLINT
            fi
            exit 1
          fi
      - name: Build debug APK with Gradle
        run: |
          chmod +x gradlew
          ./gradlew --quiet :app:compactDebugApk --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-debug
          path: app/build/outputs/compact/IPTV-debug.apk
          if-no-files-found: error
      # Release build (main only, not PRs): R8/minify via :app:compactReleaseApk.
      # The keystore comes from secrets — one-time setup, either choice works:
      #  * new release key: generate one, base64 it into RELEASE_KEYSTORE_BASE64
      #    + its passwords into RELEASE_KEYSTORE_PASSWORD / RELEASE_KEY_ALIAS /
      #    RELEASE_KEY_PASSWORD. First install needs uninstall + reinstall.
      #  * debug key for release: put base64 of the committed app/debug.keystore
      #    in RELEASE_KEYSTORE_BASE64, passwords "android", alias androiddebugkey.
      #    Updates keep working, no uninstall — but no security benefit either.
      # A missing/empty secret fails here loudly instead of shipping a
      # wrongly-signed APK.
      - name: Build release APK with Gradle
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "RELEASE_KEYSTORE_BASE64 secret is not set — see the comment above this step." >&2
            exit 1
          fi
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          chmod +x gradlew
          ./gradlew --quiet :app:compactReleaseApk --stacktrace
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: IPTV-release
          path: app/build/outputs/compact/IPTV.apk
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: IPTV-release
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_name=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          version_code=$(grep -m1 'versionCode' app/build.gradle.kts | grep -oE '[0-9]+')
          tag="v${version_name}.${version_code}"
          cp release/IPTV.apk IPTV.apk
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" IPTV.apk --clobber
          else
            gh release create "$tag" IPTV.apk \
              --title "IPTV $version_name (build $version_code)" \
              --notes "Release build (R8/minify). Install manually once — the old build looks for the IPTV-debug.apk asset, so the in-app updater cannot offer this one; afterwards it picks up later releases as before."
          fi
          echo "Published release $tag"
