name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'build-apk.sh'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          : "${sdk_root:?The runner did not provide an Android SDK path}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          if [[ ! -f "$sdk_root/platforms/android-35/android.jar" || ! -x "$sdk_root/build-tools/35.0.0/aapt2" ]]; then
            sdkmanager --sdk_root="$sdk_root" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Install Kotlin 2.4.21 from Maven Central
        run: |
          compiler_dir="$RUNNER_TEMP/iptv-kotlin"
          mkdir -p "$compiler_dir/bin"
          download() {
            local group="$1" artifact="$2" version="$3"
            curl -fLsS --retry 3 --max-time 150 \
              "https://repo.maven.apache.org/maven2/$group/$artifact/$version/$artifact-$version.jar" \
              -o "$compiler_dir/$artifact.jar"
          }
          for artifact in kotlin-compiler-embeddable kotlin-stdlib kotlin-script-runtime \
                          kotlin-daemon-embeddable kotlin-build-tools-api; do
            download org/jetbrains/kotlin "$artifact" 2.4.21
          done
          download org/jetbrains/kotlin kotlin-reflect 1.6.10
          download org/jetbrains/kotlinx kotlinx-coroutines-core-jvm 1.8.0
          download org/jetbrains annotations 24.1.0
          cat > "$compiler_dir/bin/kotlinc" <<'COMPILER'
          #!/usr/bin/env bash
          compiler_dir="$(cd "$(dirname "$0")/.." && pwd)"
          exec java -cp "$compiler_dir/*" org.jetbrains.kotlin.cli.jvm.K2JVMCompiler "$@"
          COMPILER
          chmod +x "$compiler_dir/bin/kotlinc"
          echo "KOTLINC=$compiler_dir/bin/kotlinc" >> "$GITHUB_ENV"
          echo "KOTLIN_STDLIB=$compiler_dir/kotlin-stdlib.jar" >> "$GITHUB_ENV"
      - name: Build and verify APK
        run: bash build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
